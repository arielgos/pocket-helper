name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
    paths:
      - "backend/hosting/**"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and build
        run: |
          cd backend/hosting
          npm install
          npm run build

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKET_HELPER_A4BC4 }}
          channelId: live
          projectId: pocket-helper-a4bc4
