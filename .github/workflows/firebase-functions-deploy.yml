name: Deploy Firebase Functions on change

on:
  push:
    branches:
      - master
    paths:
      - "backend/functions/**"

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/functions/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKET_HELPER_A4BC4 }}

      - name: Install function dependencies
        run: npm --prefix functions ci

      - name: Deploy functions
        run: npx firebase-tools deploy --only functions --project pocket-helper-a4bc4
