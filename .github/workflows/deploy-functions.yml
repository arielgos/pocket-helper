name: Deploy Firebase Functions

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install dependencies
        run: |
          cd backend/functions
          npm ci

      - name: Run linting
        run: |
          cd backend/functions
          npm run lint

      - name: Build functions
        run: |
          cd backend/functions
          npm run build

      - name: Deploy to Firebase
        run: |
          cd functions
          npm install -g firebase-tools
          firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
