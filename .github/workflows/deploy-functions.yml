name: Deploy Firebase Functions

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        working-directory: backend/functions
        run: npm ci --legacy-peer-deps

      - name: Run linting
        working-directory: backend/functions
        run: npm run lint

      - name: Build functions
        working-directory: backend/functions
        run: npm run build

      - name: Deploy to Firebase
        working-directory: backend
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa-key.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json firebase deploy --only functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
