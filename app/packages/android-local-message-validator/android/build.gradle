apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.localmessagevalidator'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace 'expo.modules.localmessagevalidator'
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    // ML Kit GenAI Prompt API (Gemini Nano / AICore) requires API 26+.
    minSdkVersion safeExtGet("minSdkVersion", 26)
  }

  kotlinOptions {
    jvmTarget = '17'
    // ML Kit's genai-prompt/genai-common jars ship Kotlin 2.2 metadata; the
    // project's Kotlin compiler (1.9) can still read/use it, it just needs to
    // skip the version gate since these are plain stdlib-level constructs.
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
}


dependencies {
  implementation 'com.google.mlkit:language-id:17.0.6'
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
}

